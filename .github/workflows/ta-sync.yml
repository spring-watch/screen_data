name: ta-sync

on:
  repository_dispatch:
    types: [ta-screener-updated]
  workflow_dispatch:
    inputs:
      disable_otel:
        description: "Skip sending OTel logs (dev/testing)"
        type: boolean
        default: true

env:
  TZ: America/New_York # Eastern time (EST/EDT) for all steps and the container

permissions:
  contents: write

concurrency:
  group: repo-write # shared with live-prices so pushes never race
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }} # reusable + ephemeral key

      - name: Wait for S3 endpoint
        env:
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
        run: |
          host=$(python3 -c 'import os, urllib.parse; print(urllib.parse.urlsplit(os.environ["S3_ENDPOINT"]).hostname)')
          for i in $(seq 1 12); do  # ~60s total
            # any HTTP response (even 403) means DNS + TCP + TLS work
            if getent hosts "$host" >/dev/null && curl -sS -o /dev/null --max-time 5 "$S3_ENDPOINT"; then
              echo "S3 endpoint reachable (attempt $i)"; exit 0
            fi
            echo "S3 endpoint not reachable yet (attempt $i/12)"; sleep 5
          done
          echo "::error::S3 endpoint unreachable after ~60s; is the homelab node online in the tailnet?"
          exit 1

      - name: Sync ta_screener -> ta_analysis
        env:
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          # manual: checkbox (default on); webhook: optional client_payload.disable_otel
          NO_OTEL: ${{ inputs.disable_otel || github.event.client_payload.disable_otel || '' }}
        run: |
          docker run --rm --network host -u "$(id -u):$(id -g)" -e HOME=/tmp -e TZ \
            -e S3_ENDPOINT -e S3_ACCESS_KEY_ID -e S3_SECRET_ACCESS_KEY \
            -e OTEL_EXPORTER_OTLP_ENDPOINT -e OTEL_EXPORTER_OTLP_HEADERS -e NO_OTEL \
            -v "$PWD:/w" -w /w python:3.12-slim \
            sh -c "pip install -q --user --no-warn-script-location -r scripts/requirements.txt && python scripts/sync_ta.py"

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ta_analysis screen_meta.json
          git diff --cached --quiet && { echo "no ta changes"; exit 0; }
          git commit -m "chore: sync ta_analysis $(date +%FT%T%:z)"
          git pull --rebase && git push
